  explosiveWeapons:
    name: "explosive-weapons-use-affecting-aid-access-education-and-healthcare-services"
    title: "Explosive Weapons Monitor Data by Insecurity Insight"
    caveats: "Not representative or a comprehensive compilation of all incidents in which aid access, education and healthcare services were impacted by explosive weapons use since 2020."
    notes: "This page contains agency- and open source events in which aid access, education, food systems and health care services were impacted by [explosive weapons](https://insecurityinsight.org/projects/explosive-weapons). Categorized by country. Insecurity Insight collaborates with the [International Network on Explosive Weapons (INEW)](https://www.inew.org/) in producing research and analysis on the harm and use of explosive weapons for the [Explosive Weapons Monitor](https://www.explosiveweaponsmonitor.org/) by documenting their effects on health care, education, food systems and aid access. Please get in touch if you are interested in curated Resources: info@insecurityinsight.org"
    license_id: "cc-by-sa"
    methodology_other: "Systematically collected from open source, public reports as well as verified submissions from our partner agencies."
    tags:
      - "complex emergency-conflict-security"
      - "conflict-violence"
    resource_descriptions:
      incidents-current-year: "Resource covering 01 January to {end_date} on incidents in which aid access, education, healthcare services and food systems were impacted by [explosive weapons](https://insecurityinsight.org/projects/explosive-weapons) based on agency- and open source events. Categorised by country."
      incidents: "Resource covering 01 January 2020 to {end_date} on incidents in which aid access, education, healthcare services and food systems were impacted by [explosive weapons](https://insecurityinsight.org/projects/explosive-weapons) based on agency- and open source events. Categorised by country."
      overview: "Resource covering 01 January 2020 to {end_date} on incidents in which aid access, education, healthcare services and food systems were impacted by [explosive weapons](https://insecurityinsight.org/projects/explosive-weapons) based on agency- and open source events. Categorised by country and year."

