# Collector specific configuration
base_url: "https://sind-api.herokuapp.com/hdx/v1/"

country_dataset_basename: "insecurity-insight-country-dataset"

topics:
  aidworkerKIKA: "Aid Worker KIKA"
  healthcare: "Attacks on Health Care"
  vaccinations: "Attacks on Public Health"
  children: "Children in Armed Conflict"
  countryYear: ""
  fivc: "Conflict-Related Incidents Affecting Food Systems"
  sv:
     CRSV: "Conflict-Related Sexual Violence (CRSV)"
     SVPoliticalViolence: "Political-Related Sexual Violence"
     overview: "Conflict-Related (CRSV) or Political-Related Sexual Violence"
  education: "Education in Danger"
  explosiveWeapons: "Explosive Weapons"
  protection: "Protection in Danger"
  water: "Water Systems"

topic_types:
  - "incidents"
  - "incidents-current-year"
  - "overview"

datasets:
  aidworkerKIKA:
    name: "sind-aid-worker-kka-dataset"
    title: "Aid Worker KIKA (Killed, Injured, Kidnapped or Arrested) Data"
    caveats: "Not representative or a comprehensive compilation of all events in which an aid worker was killed, kidnapped, or arrested.  \nKey definitions  \nAid worker: An individual employed by or attached to a humanitarian, UN, international, national, or government aid agency.  \nKilled: Refers to a staff member being killed. Aid worker(s) killed while in captivity are coded as \u2018kidnapped\u2019.  \nKidnapped: Refers to a staff member being kidnapped, missing or taken hostage.  \nArrested: Refers to a staff member being arrested, charged, detained, fined or imprisoned.  \nData collection is ongoing and data may change as more information is made available."
    notes: "This page contains agency- and publicly-reported data for events in which an aid worker was [killed, injured, kidnapped, or arrested (KIKA)](https://insecurityinsight.org/projects/aid-in-danger/aid-security-digests). Categorized by country. Please get in touch if you are interested in curated Resources: info@insecurityinsight.org"
    license_id: "cc-by-sa"
    methodology_other: "Systematically collected from open source, public reports as well as verified submissions from our partner agencies."
    tags:
      - "aid worker security"
      - "aid workers"
      - "conflict-violence"
      - "indicators"
    resource_descriptions:
      incidents-current-year: "Resource covering 01 January to {end_date} on aid workers [killed, injured, kidnapped, or arrested (KIKA)](https://insecurityinsight.org/projects/aid-in-danger/aid-security-digests) based on agency- and open source events. Categorized by country."
      incidents: "Resource covering 01 January 1997 to {end_date} on aid workers [killed, injured, kidnapped, or arrested (KIKA)](https://insecurityinsight.org/projects/aid-in-danger/aid-security-digests) based on agency- and open source events. Categorized by country."
      overview: "Resource covering 01 January 1997 to {end_date} on aid workers [killed, injured, kidnapped, or arrested (KIKA)](https://insecurityinsight.org/projects/aid-in-danger/aid-security-digests) based on agency- and open source events. Categorized by country and year."

  healthcare:
    name: "sind-safeguarding-healthcare-monthly-news-briefs-dataset"
    title: "Attacks on Health Care Data"
    caveats: "Not representative or a comprehensive compilation of all events affecting the provision of healthcare. Data collection is ongoing and data may change as more information is made available."
    notes: "This page contains agency- and open source events published in the [Attacks on Health Care News Brief](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief). Categorized by country. Please get in touch if you are interested in curated Resources: info@insecurityinsight.org. For data supporting the Safeguarding Health in Conflict Coalition (SHCC), please see: https://data.humdata.org/dataset/shcchealthcare-dataset"
    license_id: "cc-by-sa"
    methodology_other: "Systematically collected from open source using the SiND."
    tags:
      - "complex emergency-conflict-security"
      - "disease"
      - "health"
      - "health facilities"
    resource_descriptions:
      incidents-current-year: "Resource covering 01 January to {end_date} on [attacks on health care](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief) based on agency- and open source events. Categorised by country."
      incidents: "Resource covering 01 January 2016 to {end_date} on [attacks on health care](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief) based on agency- and open source events. Categorised by country."
      overview: "Resource covering 01 January 2016 to {end_date} on [attacks on health care](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief) based on agency- and open source events. Categorised by country and year."

  vaccinations:
    name: "attacks-on-vaccination-campaigns"
    title: "Attacks on Public Health-Related Programmes Data"
    caveats: "Not representative or a comprehensive compilation of all events affecting the provision of healthcare. Data collection is ongoing and data may change as more information is made available."
    notes: "This page contains agency- and open source events affecting public-health related programmes, including COVID-19, Ebola, and vaccination campaigns. published in the Attacks on Health Care News Brief. Categorized by country. Please get in touch if you are interested in curated Resources: info@insecurityinsight.org."
    license_id: "cc-by-sa"
    methodology_other: "Systematically collected from open source using the SiND."
    tags:
      - "complex emergency-conflict-security"
      - "disease"
      - "health"
      - "health facilities"
    resource_descriptions:
      incidents-current-year: "Resource covering 01 January to {end_date} on [attacks on health care](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief) affecting public-health related programmes, including COVID-19, Ebola, and vaccination campaigns. published in the [Attacks on Health Care News Brief](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief). Based on agency- and open source events. Categorized by country."
      incidents: "Resource covering 01 January 2016 to {end_date} on [attacks on health care](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief) affecting public-health related programmes, including COVID-19, Ebola, and vaccination campaigns. published in the [Attacks on Health Care News Brief](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief). Based on agency- and open source events. Categorized by country."
      overview: "Resource covering 01 January 2016 to {end_date} on [attacks on health care](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief) affecting public-health related programmes, including COVID-19, Ebola, and vaccination campaigns. published in the [Attacks on Health Care News Brief](https://insecurityinsight.org/projects/healthcare/monthlynewsbrief). Based on agency- and open source events. Categorized by country and year."

  children:
    name: "children-in-armed-conflict-data"
    title: "Conflict Incidents Affecting Children and Children-Related Services Incident Data"
    caveats: "Not representative or a comprehensive compilation of all events affecting the provision of healthcare. Data collection is ongoing and data may change as more information is made available."
    notes: "This page contains agency- and publicly-reported data for events affecting children and children-related services in conflict zones. Based on agency- and open source events. Categorized by country."
    license_id: "cc-by-sa"
    methodology_other: "Systematically collected from open source using the SiND."
    tags:
      - "children"
      - "conflict-violence"
    resource_descriptions:
      incidents-current-year: "Resource covering 01 January to {end_date} on incidents affecting children and children-related services in conflict zones. Based on agency- and open source events. Categorized by country."
      incidents: "Resource covering 01 January 2024 to {end_date} on incidents affecting children and children-related services in conflict zones. Based on agency- and open source events. Categorized by country."
      overview: "Resource covering 01 January 2024 to {end_date} on incidents affecting children and children-related services in conflict zones. Based on agency- and open source events. Categorized by country and year."

  fivc:
    name: "conflict-hunger-and-aid-security"
    title: "Conflict-Related Incidents Affecting Food Systems"
    caveats: "Not representative or a comprehensive compilation of all events impacting food security. Data collection is ongoing and data may change as more information is made available."
    notes: "This page contains data on conflict events with clearly foreseeable impacts on or links to food systems based on agency-and open source events. Covers Cameroon, DRC, Lebanon, Mali, Myanmar, Niger, oPt, Somalia, Sudan, Syria and Yemen. Please get in touch if you are interested in curated datasets: info@insecurityinsight.org"
    license_id: "cc-by-igo"
    methodology_other: "Systematically collected from open source using the SiND."
    tags:
      - "conflict-violence"
      - "food security"
    resource_descriptions:
      incidents-current-year: "Resource covering 01 January to {end_date} on conflict-related incidents with clearly foreseeable impacts on or links to [food systems](https://insecurityinsight.org/conflict-and-hunger) based on agency- and open source events from Burkina Faso, Cameroon, DRC, Iraq, Lebanon, Mali, Myanmar, Niger, OPT, Somalia, Sudan, Syria, Ukraine and Yemen. Categorized by country."
      incidents: "Resource covering 01 January 2024 to {end_date} on conflict-related incidents with clearly foreseeable impacts on or links to [food systems](https://insecurityinsight.org/conflict-and-hunger) based on agency- and open source events from Burkina Faso, Cameroon, DRC, Iraq, Lebanon, Mali, Myanmar, Niger, OPT, Somalia, Sudan, Syria, Ukraine and Yemen. Categorized by country."
      overview: "Resource covering 01 January 2024 to {end_date} on conflict-related incidents with clearly foreseeable impacts on or links to [food systems](https://insecurityinsight.org/conflict-and-hunger) based on agency- and open source events from Burkina Faso, Cameroon, DRC, Iraq, Lebanon, Mali, Myanmar, Niger, OPT, Somalia, Sudan, Syria, Ukraine and Yemen. Categorized by country and year."

  sv:
    name: "conflict-related-sexual-violence"
    title: "Conflict-Related (CRSV) or Political-Related Sexual Violence Data"
    caveats: "The incidents reported are not a complete nor a representative list of all incidents and have not been independently verified."
    notes: "This page contains publicly-reported cases of conflict-related and political [sexual violence](https://insecurityinsight.org/projects/reporting-sexual-violence-and-abuse-in-conflict-settings) by conflict actors, security personnel, and sexual violence violence that targets aid workers, educators, health workers and IDPS/refugees. Please get in touch if you are interested in curated Resources: info@insecurityinsight.org"
    license_id: "cc-by"
    methodology_other: "Systematically collected from open source, public reports as well as verified submissions from our partner agencies."
    tags:
      - "conflict-violence"
      - "gender-based violence-gbv"
    resource_descriptions:
      CRSV:
        incidents-current-year: "Resource covering 01 January to {end_date} on incidents of [sexual violence](https://insecurityinsight.org/projects/reporting-sexual-violence-and-abuse-in-conflict-settings) perpetrated by conflict actors. Categorised by country."
        incidents: "Resource covering 01 January 2020 to {end_date} on incidents of [sexual violence](https://insecurityinsight.org/projects/reporting-sexual-violence-and-abuse-in-conflict-settings) perpetrated by conflict actors. Categorised by country."
      SVPoliticalViolence:
        incidents-current-year: "Resource covering 01 January to {end_date} on incidents of [sexual violence](https://insecurityinsight.org/projects/reporting-sexual-violence-and-abuse-in-conflict-settings) perpetrated by police or state security personnel. Categorised by country."
        incidents: "Resource covering 01 January 2020 to {end_date} on incidents of [sexual violence](https://insecurityinsight.org/projects/reporting-sexual-violence-and-abuse-in-conflict-settings) perpetrated by police or state security personnel. Categorised by country."
      overview: "Resource covering 01 January 2020 to {end_date} on incidents of [sexual violence](https://insecurityinsight.org/projects/reporting-sexual-violence-and-abuse-in-conflict-settings) perpetrated by conflict actors, security personnel, and sexual violence that targets aid workers, educators, health workers and IDPs/refugees. Categorised by country and year."

